name: CI/CT

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install dependencies and build project
        run: |
          mvn clean install
        continue-on-error: false

      - name: Run unit tests
        run: |
          mvn test
        continue-on-error: false

      - name: Generate coverage report with JaCoCo
        run: |
          mvn jacoco:report
        continue-on-error: false

      - id: find-jar
        name: Buscar JAR generado en target/
        run: |
          echo "Contenido de target/:"
          ls -la target || true
          jar=$(ls target/*.jar 2>/dev/null | head -n 1 || true)
          if [ -z "$jar" ]; then
            echo "No se encontró ningún .jar en target/. Asegúrate de que la build genera un .jar."
            exit 1
          fi
          echo "JAR encontrado: $jar"
          echo "JAR=$jar" >> $GITHUB_OUTPUT

      - name: Subir .jar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-jar
          path: ${{ steps.find-jar.outputs.JAR }}
          retention-days: 30

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Cleanup temporary files
        if: always()
        run: |
          echo "Limpiando archivos temporales..."
          rm -rf ~/.m2/repository/org/apache/maven/plugins || true
          echo "Limpieza completada"

      - name: Report workflow status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Todas las pruebas pasaron correctamente"
          else
            echo "❌ El workflow falló. Revisa los logs anteriores para más detalles."
            exit 1
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true